services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lastro
      POSTGRES_PASSWORD: ${LASTRO_DB_PASSWORD:-lastro}
      POSTGRES_DB: lastro
    volumes:
      - lastro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastro -d lastro"]
      interval: 2s
      timeout: 2s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "packages/db/src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://lastro:${LASTRO_DB_PASSWORD:-lastro}@postgres:5432/lastro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "apps/api/src/index.ts"]
    environment:
      DATABASE_URL: postgres://lastro:${LASTRO_DB_PASSWORD:-lastro}@postgres:5432/lastro
      HOST: 0.0.0.0
      PORT: "3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3001:3001"

  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "apps/mcp/src/index.ts"]
    environment:
      DATABASE_URL: postgres://lastro:${LASTRO_DB_PASSWORD:-lastro}@postgres:5432/lastro
      HOST: 0.0.0.0
      PORT: "3002"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3002:3002"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bun", "apps/worker/src/run.ts"]
    environment:
      DATABASE_URL: postgres://lastro:${LASTRO_DB_PASSWORD:-lastro}@postgres:5432/lastro
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/apps/web
    command: ["bun", "run", "start"]
    environment:
      LASTRO_API_URL: ${LASTRO_API_URL:-http://api:3001}
      LASTRO_API_TOKEN: ${LASTRO_API_TOKEN:-}
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:3000"

volumes:
  lastro_pgdata:
